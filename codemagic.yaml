workflows:
  ios-testflight:
    name: DishList iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dishlist-app-store-connect
    environment:
      groups:
        - firebase-production
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.giovanniaccinelli.dishlist
      vars:
        BUNDLE_ID: com.giovanniaccinelli.dishlist
        NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBAos19VBROVcYRMu6I7Wg4tW2LnJbstnw
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dishlist-7f0ae.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: dishlist-7f0ae
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dishlist-7f0ae.firebasestorage.app
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "938623496427"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:938623496427:web:bdddc75b0a747ab4e50eae"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build Next app
        script: |
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set iOS build number
        script: |
          cd ios/App
          EFFECTIVE_BUILD_NUMBER="${BUILD_NUMBER:-20}"
          if [ "$EFFECTIVE_BUILD_NUMBER" -lt 20 ]; then
            EFFECTIVE_BUILD_NUMBER=20
          fi
          echo "Using iOS build number $EFFECTIVE_BUILD_NUMBER"
          agvtool new-version -all "$EFFECTIVE_BUILD_NUMBER"
      - name: Set up code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
          echo "----- INSTALLED PROVISIONING PROFILE ENTITLEMENTS -----"
          MATCHED_APPLE_SIGN_IN_PROFILE=0
          MAIN_APP_GROUP_PROFILE_COUNT=0
          SHARE_EXTENSION_APP_GROUP_PROFILE_COUNT=0
          MAIN_APP_GROUP_PROFILE_NAME=""
          MAIN_APP_GROUP_PROFILE_UUID=""
          SHARE_EXTENSION_APP_GROUP_PROFILE_NAME=""
          SHARE_EXTENSION_APP_GROUP_PROFILE_UUID=""
          FOUND_PROFILE=0
          for profile_dir in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            [ -d "$profile_dir" ] || continue
            for profile in "$profile_dir"/*.mobileprovision "$profile_dir"/*.provisionprofile; do
              [ -e "$profile" ] || continue
              FOUND_PROFILE=1
              echo "$profile"
              security cms -D -i "$profile" > /tmp/profile.plist
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null || echo "Unknown")
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist 2>/dev/null || echo "Unknown")
              PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null || echo "")
              PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
              PROFILE_CREATED=$(/usr/libexec/PlistBuddy -c "Print :CreationDate" /tmp/profile.plist 2>/dev/null || echo "Unknown")
              PROFILE_EXPIRES=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" /tmp/profile.plist 2>/dev/null || echo "Unknown")
              echo "Name: $PROFILE_NAME"
              echo "UUID: $PROFILE_UUID"
              echo "Bundle ID: $PROFILE_BUNDLE_ID"
              echo "Created: $PROFILE_CREATED"
              echo "Expires: $PROFILE_EXPIRES"
              /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist || true
              if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" /tmp/profile.plist >/dev/null 2>&1; then
                MATCHED_APPLE_SIGN_IN_PROFILE=1
              fi
              if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" /tmp/profile.plist | grep -q "group.com.giovanniaccinelli.dishlist.share"; then
                echo "App Group: YES"
                if [ "$PROFILE_BUNDLE_ID" = "com.giovanniaccinelli.dishlist" ]; then
                  MAIN_APP_GROUP_PROFILE_COUNT=$((MAIN_APP_GROUP_PROFILE_COUNT + 1))
                  MAIN_APP_GROUP_PROFILE_NAME="$PROFILE_NAME"
                  MAIN_APP_GROUP_PROFILE_UUID="$PROFILE_UUID"
                fi
                if [ "$PROFILE_BUNDLE_ID" = "com.giovanniaccinelli.dishlist.ShareExtension" ]; then
                  SHARE_EXTENSION_APP_GROUP_PROFILE_COUNT=$((SHARE_EXTENSION_APP_GROUP_PROFILE_COUNT + 1))
                  SHARE_EXTENSION_APP_GROUP_PROFILE_NAME="$PROFILE_NAME"
                  SHARE_EXTENSION_APP_GROUP_PROFILE_UUID="$PROFILE_UUID"
                fi
              else
                echo "App Group: NO"
                if [ "$PROFILE_BUNDLE_ID" = "com.giovanniaccinelli.dishlist" ] || [ "$PROFILE_BUNDLE_ID" = "com.giovanniaccinelli.dishlist.ShareExtension" ]; then
                  echo "Removing stale profile without required App Group: $PROFILE_NAME ($PROFILE_UUID)"
                  rm -f "$profile"
                fi
              fi
              echo "-----"
            done
          done
          if [ "$FOUND_PROFILE" != "1" ]; then
            echo "ERROR: Codemagic did not install any provisioning profile."
            echo "Check Codemagic iOS code signing settings/integration for bundle $BUNDLE_ID."
            exit 1
          fi
          if [ "$MATCHED_APPLE_SIGN_IN_PROFILE" != "1" ]; then
            echo "ERROR: Installed provisioning profile still does not include com.apple.developer.applesignin."
            echo "Regenerate the App Store provisioning profile after enabling Sign in with Apple on the App ID."
            exit 1
          fi
          if [ "$MAIN_APP_GROUP_PROFILE_COUNT" -lt 1 ] || [ "$SHARE_EXTENSION_APP_GROUP_PROFILE_COUNT" -lt 1 ]; then
            echo "ERROR: App Group group.com.giovanniaccinelli.dishlist.share must be present in one main app profile and one share extension profile."
            echo "Main app profiles with App Group: $MAIN_APP_GROUP_PROFILE_COUNT"
            echo "Share extension profiles with App Group: $SHARE_EXTENSION_APP_GROUP_PROFILE_COUNT"
            echo "Look above for the exact profile Name/UUID/Bundle ID that Codemagic installed."
            exit 1
          fi
          echo "Forcing App Group provisioning profiles into Xcode project..."
          export MAIN_APP_GROUP_PROFILE_NAME MAIN_APP_GROUP_PROFILE_UUID SHARE_EXTENSION_APP_GROUP_PROFILE_NAME SHARE_EXTENSION_APP_GROUP_PROFILE_UUID
          ruby - <<'RUBY'
          path = "ios/App/App.xcodeproj/project.pbxproj"
          text = File.read(path)
          profiles = {
            "com.giovanniaccinelli.dishlist" => [ENV.fetch("MAIN_APP_GROUP_PROFILE_NAME"), ENV.fetch("MAIN_APP_GROUP_PROFILE_UUID")],
            "com.giovanniaccinelli.dishlist.ShareExtension" => [ENV.fetch("SHARE_EXTENSION_APP_GROUP_PROFILE_NAME"), ENV.fetch("SHARE_EXTENSION_APP_GROUP_PROFILE_UUID")],
          }
          text = text.gsub(/\n\t\t\tbuildSettings = \{.*?\n\t\t\t\};/m) do |block|
            bundle_id = block[/PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);/, 1]
            next block unless bundle_id && profiles.key?(bundle_id)
            profile_name, profile_uuid = profiles.fetch(bundle_id)
            next block if profile_name.empty? || profile_uuid.empty?
            updated = block
            {
              "CODE_SIGN_STYLE" => "Manual",
              "DEVELOPMENT_TEAM" => "6G5LUUC32R",
              "PROVISIONING_PROFILE_SPECIFIER" => "\"#{profile_name}\"",
              "PROVISIONING_PROFILE" => profile_uuid,
            }.each do |key, value|
              if updated.match?(/^\t\t\t\t#{Regexp.escape(key)}(?:\[[^\]]+\])? = /)
                updated = updated.gsub(/^\t\t\t\t#{Regexp.escape(key)}(?:\[[^\]]+\])? = [^;]+;/, "\t\t\t\t#{key} = #{value};")
              else
                updated = updated.sub(/\n\t\t\t\};/, "\n\t\t\t\t#{key} = #{value};\n\t\t\t};")
              end
            end
            updated
          end
          File.write(path, text)
          RUBY
          echo "Forced main app profile: $MAIN_APP_GROUP_PROFILE_NAME ($MAIN_APP_GROUP_PROFILE_UUID)"
          echo "Forced share extension profile: $SHARE_EXTENSION_APP_GROUP_PROFILE_NAME ($SHARE_EXTENSION_APP_GROUP_PROFILE_UUID)"
          echo "----- FORCED PROJECT SIGNING SETTINGS -----"
          grep -n -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_STYLE" ios/App/App.xcodeproj/project.pbxproj || true
          ruby -e 'File.write("/tmp/dishlist-signing-profiles.env", {
            "MAIN_APP_GROUP_PROFILE_NAME" => ENV.fetch("MAIN_APP_GROUP_PROFILE_NAME"),
            "MAIN_APP_GROUP_PROFILE_UUID" => ENV.fetch("MAIN_APP_GROUP_PROFILE_UUID"),
            "SHARE_EXTENSION_APP_GROUP_PROFILE_NAME" => ENV.fetch("SHARE_EXTENSION_APP_GROUP_PROFILE_NAME"),
            "SHARE_EXTENSION_APP_GROUP_PROFILE_UUID" => ENV.fetch("SHARE_EXTENSION_APP_GROUP_PROFILE_UUID"),
          }.map { |key, value| "#{key}=#{value.dump}" }.join("\n") + "\n")'
          if [ -f /Users/builder/export_options.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.giovanniaccinelli.dishlist $MAIN_APP_GROUP_PROFILE_NAME" /Users/builder/export_options.plist || true
            /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.giovanniaccinelli.dishlist.ShareExtension $SHARE_EXTENSION_APP_GROUP_PROFILE_NAME" /Users/builder/export_options.plist || true
          fi
      - name: Build signed IPA
        script: |
          set -euo pipefail
          ARCHIVE_PATH="$PWD/build/ios/xcarchive/App.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          echo "----- FINAL SIGNING BUILD SETTINGS -----"
          if [ ! -f /tmp/dishlist-signing-profiles.env ]; then
            echo "ERROR: Missing selected signing profile file from setup step."
            exit 1
          fi
          # shellcheck disable=SC1091
          . /tmp/dishlist-signing-profiles.env
          MAIN_FINAL_SIGNING_SETTINGS="$(xcodebuild -project "$XCODE_PROJECT" -target App -configuration Release -showBuildSettings)"
          SHARE_FINAL_SIGNING_SETTINGS="$(xcodebuild -project "$XCODE_PROJECT" -target DishListShareExtension -configuration Release -showBuildSettings)"
          printf '%s\n%s\n' "$MAIN_FINAL_SIGNING_SETTINGS" "$SHARE_FINAL_SIGNING_SETTINGS" | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS" || true
          if ! printf '%s\n' "$MAIN_FINAL_SIGNING_SETTINGS" | grep -Fq "PROVISIONING_PROFILE_SPECIFIER = $MAIN_APP_GROUP_PROFILE_NAME"; then
            echo "ERROR: Xcode is not using the selected main app App Group profile: $MAIN_APP_GROUP_PROFILE_NAME"
            exit 1
          fi
          if ! printf '%s\n' "$SHARE_FINAL_SIGNING_SETTINGS" | grep -Fq "PROVISIONING_PROFILE_SPECIFIER = $SHARE_EXTENSION_APP_GROUP_PROFILE_NAME"; then
            echo "ERROR: Xcode is not using the selected share extension App Group profile: $SHARE_EXTENSION_APP_GROUP_PROFILE_NAME"
            exit 1
          fi
          if ! printf '%s\n' "$MAIN_FINAL_SIGNING_SETTINGS" | grep -Fq "PROVISIONING_PROFILE = $MAIN_APP_GROUP_PROFILE_UUID"; then
            echo "ERROR: Xcode is not using the selected main app App Group profile UUID: $MAIN_APP_GROUP_PROFILE_UUID"
            exit 1
          fi
          if ! printf '%s\n' "$SHARE_FINAL_SIGNING_SETTINGS" | grep -Fq "PROVISIONING_PROFILE = $SHARE_EXTENSION_APP_GROUP_PROFILE_UUID"; then
            echo "ERROR: Xcode is not using the selected share extension App Group profile UUID: $SHARE_EXTENSION_APP_GROUP_PROFILE_UUID"
            exit 1
          fi
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=6G5LUUC32R \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            CODE_SIGN_STYLE=Manual || {
            echo "----- XCODEBUILD LOGS -----"
            find /tmp/xcodebuild_logs -maxdepth 1 -type f -print -exec cat {} \;
            exit 1
          }
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist /Users/builder/export_options.plist || {
            echo "----- XCODEBUILD LOGS -----"
            find /tmp/xcodebuild_logs -maxdepth 1 -type f -print -exec cat {} \;
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: VVLCZK238Q
        issuer_id: 75bff3d7-7609-4a92-9b66-212cfb0d4861
        submit_to_testflight: true
